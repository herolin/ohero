name: Deploy to GitHub Pages

# Deploy host for the ohero site. Publishes:
#   /                       -> official site placeholder (ohero-site/index.html)
#   /games/                 -> game menu (ohero-site/games-index.html)
#   /games/g001-bomb/       -> single-player build (ohero "stable" branch)
#   /games/g002-bomb-mp/    -> multiplayer build (ohero "main" branch)
#
# Both game builds come from the game1-bomb source (two branches) for now; see
# DEPLOY.md for the target model where each game repo publishes its own dist.

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # ---- Multiplayer build (this branch: main) -> /games/g002-bomb-mp/ ----
      - name: Checkout mp (main)
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Build multiplayer version
        run: |
          npm ci
          npm run build
          mkdir -p site/games/g002-bomb-mp
          cp -r dist/. site/games/g002-bomb-mp/

      # ---- Single-player build (stable branch) -> /games/g001-bomb/ ----
      - name: Checkout single-player (stable)
        uses: actions/checkout@v4
        with:
          ref: stable
          path: stable

      - name: Build single-player version
        run: |
          cd stable
          npm ci
          npm run build
          mkdir -p ../site/games/g001-bomb
          cp -r dist/. ../site/games/g001-bomb/

      # ---- Games published by their own repos (committed under games/) ----
      - name: Include externally-published games
        run: |
          if [ -d games ]; then
            mkdir -p site/games
            cp -r games/. site/games/
          fi

      # ---- Official site + game menu (static, from ohero-site/) ----
      - name: Add official site + menu
        run: |
          cp ohero-site/index.html site/index.html
          cp ohero-site/games-index.html site/games/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
