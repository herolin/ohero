name: Deploy to GitHub Pages

# Deploy host for the ohero site. Publishes:
#   /                       -> official site placeholder (ohero-site/index.html)
#   /games/                 -> game menu (ohero-site/games-index.html)
#   /games/g001-bomb/       -> single-player build (same source, VITE_SINGLE_PLAYER=1)
#   /games/g002-bomb-mp/    -> multiplayer build (same source, no flag)
#
# Both minesweeper builds come from THIS branch, one flag apart; see DEPLOY.md
# for the model the other games already follow, where each repo publishes its
# own dist into games/.

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # ---- Multiplayer build -> /games/g002-bomb-mp/ ----
      - name: Build multiplayer version
        run: |
          npm ci
          npm run build
          mkdir -p site/games/g002-bomb-mp
          cp -r dist/. site/games/g002-bomb-mp/

      # ---- Single-player build -> /games/g001-bomb/ ----
      #
      # SAME COMMIT, one flag different. This used to check out a `stable`
      # branch, and that branch silently fell far behind — it never received
      # the score board, the player name or the start screen, because nobody
      # opens a branch they aren't working on. A build flag cannot drift.
      - name: Build single-player version
        env:
          VITE_SINGLE_PLAYER: '1'
        run: |
          npm run build
          mkdir -p site/games/g001-bomb
          cp -r dist/. site/games/g001-bomb/

      # ---- Games published by their own repos (committed under games/) ----
      - name: Include externally-published games
        run: |
          if [ -d games ]; then
            mkdir -p site/games
            cp -r games/. site/games/
          fi

      # ---- Official site + game menu (static, from ohero-site/) ----
      - name: Add official site + menu
        run: |
          cp ohero-site/index.html site/index.html
          cp ohero-site/games-index.html site/games/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
