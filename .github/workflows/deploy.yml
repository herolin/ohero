name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/stage5-race
  workflow_dispatch:

# Allow the workflow to publish to GitHub Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Only keep the latest Pages deployment running.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # ---- Stage 5 dev version (this branch) -> /game1-bomb-dev/ ----
      - name: Checkout (dev)
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Build dev version
        run: |
          npm ci
          npm run build
          mkdir -p site/game1-bomb-dev
          cp -r dist/. site/game1-bomb-dev/

      # ---- Frozen stable version (single-player + lobby) -> /game1-bomb/ ----
      - name: Checkout stable version
        uses: actions/checkout@v4
        with:
          ref: claude/claude-md-docs-22o0b2
          path: stable

      - name: Build stable version
        run: |
          cd stable
          npm ci
          npm run build
          mkdir -p ../site/game1-bomb
          cp -r dist/. ../site/game1-bomb/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
