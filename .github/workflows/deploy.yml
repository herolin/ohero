name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/claude-md-docs-22o0b2
  workflow_dispatch:

# Allow the workflow to publish to GitHub Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Only keep the latest Pages deployment running.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # Publish under a /game1-bomb/ sub-path so the same Pages site can host
      # multiple games (https://<user>.github.io/ohero/game1-bomb/).
      - name: Stage site under /game1-bomb/ sub-path
        run: |
          mkdir -p site/game1-bomb
          cp -r dist/. site/game1-bomb/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
